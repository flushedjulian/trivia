<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --card-bg: rgba(8, 5, 6, 0.92);
    --text: #f6eeee;
    --muted: #a88d8f;
    --accent: #b0101c;       /* dunkelrot: Rahmen, Balken */
    --accent-dark: #5c060d;
    --highlight: #ff3b47;    /* helles Rot: Punkte, Countdown */
    --row: rgba(255, 255, 255, 0.07);      /* Zeilen in Listen */
    --row-alt: rgba(255, 255, 255, 0.035); /* jede zweite Zeile, etwas dunkler */
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --max-card: 780px;       /* größte Kartenhöhe (Top 10 bei Schätzfragen = 761px) – so groß ist das Menü */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent; /* transparent für OBS */
    color: var(--text);
    font-family: "Outfit", system-ui, sans-serif;
    overflow: hidden;
  }
  body.test { background: #3a3a3a; }

  #stage {
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }
  .card {
    width: min(900px, 92vw);
    background: var(--card-bg);
    border: 3px solid var(--accent);
    border-radius: 28px;
    padding: 28px 36px 32px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 32px rgba(176, 16, 28, 0.25);
    transition: opacity 0.45s var(--ease), transform 0.45s var(--ease), min-height 0.4s var(--ease);
    min-height: 0;
  }
  /* Menü zeigt die maximale Größe, damit man das Overlay in OBS sauber platzieren kann */
  .card.full { min-height: var(--max-card); }
  .commands { margin-top: 28px; font-size: 22px; color: var(--muted); line-height: 1.7; }
  .commands b { color: var(--text); font-weight: 600; }
  .card.hidden { opacity: 0; transform: translateY(40px); transition-timing-function: ease-in; }

  /* Kopfzeile mit "Nächste Frage in …" – bleibt stehen, während der Inhalt darunter wechselt */
  .head {
    display: flex; justify-content: space-between; align-items: center;
    max-height: 120px; overflow: hidden;
    padding-bottom: 16px; margin-bottom: 20px;
    border-bottom: 2px solid var(--accent-dark);
    transition: max-height 0.4s var(--ease), opacity 0.4s var(--ease),
      padding 0.4s var(--ease), margin 0.4s var(--ease), border-color 0.4s var(--ease);
  }
  .head.off { max-height: 0; opacity: 0; padding-bottom: 0; margin-bottom: 0; border-color: transparent; }
  .head .big { font-size: 48px; font-weight: 800; line-height: 1; color: var(--highlight); font-variant-numeric: tabular-nums; }
  /* Höhe passt sich weich an; Inhalt fährt nach unten raus und von unten wieder rein */
  .body { overflow: hidden; margin: 0 -10px; padding: 0 10px; transition: height 0.4s var(--ease); }
  .content { transition: opacity 0.4s var(--ease), transform 0.4s var(--ease); }
  .content.out { opacity: 0; transform: translateY(28px); transition-duration: 0.22s; transition-timing-function: ease-in; }

  .top { display: flex; justify-content: flex-end; }
  .timer { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .question { font-size: 44px; font-weight: 800; line-height: 1.2; margin: 8px 0 18px; }
  .points-row { display: flex; align-items: center; gap: 16px; }
  .points { font-size: 24px; font-weight: 600; color: var(--highlight); min-width: 150px; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent-dark), var(--highlight)); border-radius: 999px; }
  .hint { margin-top: 14px; font-size: 22px; color: var(--muted); }

  .label { font-size: 22px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .answer { font-size: 56px; font-weight: 800; color: #fff; margin: 6px 0 14px; display: flex; align-items: center; gap: 20px; }
  .flag-small { height: 52px; border-radius: 6px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.6); }
  .winner { font-size: 32px; font-weight: 600; }
  .winner .pts { color: var(--highlight); }

  .flag {
    display: block; height: 220px; max-width: 100%; margin: 8px 0 22px;
    border-radius: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
  }

  /* Wort erkennen: ein Feld pro Buchstabe */
  .word-row { display: flex; align-items: flex-end; gap: 28px; margin: 12px 0 24px; }
  .slots { display: flex; flex-wrap: wrap; gap: 10px; }
  .count { font-size: 24px; font-weight: 600; color: var(--muted); white-space: nowrap; padding-bottom: 6px; }
  .slot {
    width: var(--slot, 52px); height: calc(var(--slot, 52px) * 1.27);
    display: flex; align-items: flex-end; justify-content: center;
    border-bottom: 4px solid var(--muted);
    font-size: calc(var(--slot, 52px) * 0.96); font-weight: 800; line-height: 1; color: var(--highlight);
  }
  .slot.open { border-color: var(--highlight); }
  .slot.space { border: 0; width: calc(var(--slot, 52px) / 2); }

  .title { font-size: 36px; font-weight: 800; margin: 0 0 16px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { padding: 10px 16px; border-radius: 14px; background: var(--row); }
  .rows li:nth-child(even) { background: var(--row-alt); }
  .rows li + li { margin-top: 6px; }

  .board li { display: flex; align-items: center; gap: 18px; font-size: 30px; }
  .board li.me { outline: 2px solid var(--accent); outline-offset: -2px; }
  .board .rank { width: 48px; font-weight: 800; color: var(--muted); }
  .board li:first-child .rank { color: var(--highlight); }
  .board .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .score { font-weight: 800; color: var(--highlight); font-variant-numeric: tabular-nums; }
  .empty { font-size: 26px; color: var(--muted); }
  .board.guesses li { font-size: 24px; padding: 6px 14px; }
  .board.guesses li + li { margin-top: 4px; }
  .board .tip { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .unit-badge {
    display: inline-block; margin: -4px 0 20px; padding: 6px 16px;
    font-size: 26px; font-weight: 800; color: var(--highlight);
    border: 2px solid var(--highlight); border-radius: 12px;
  }
  .guess-meta { margin: -4px 0 14px; font-size: 20px; color: var(--muted); }

  .modes li {
    display: grid; grid-template-columns: max-content 1fr; align-items: center; gap: 24px;
    font-size: 32px; font-weight: 600; padding: 12px 16px;
  }
  .modes .cmd { color: var(--highlight); font-weight: 800; font-variant-numeric: tabular-nums; }
  .modes li > span:last-child { min-width: 0; overflow-wrap: anywhere; }

  /* Testmodus */
  #testpanel {
    position: fixed; left: 16px; right: 16px; bottom: 16px;
    max-width: 900px; margin: 0 auto;
    background: #fff; color: #222; border-radius: 14px; padding: 14px;
    font-size: 15px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
  }
  #testpanel form { display: flex; gap: 8px; flex-wrap: wrap; }
  #testpanel input { font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; }
  #testpanel input[name=user] { width: 140px; }
  #testpanel input[name=msg] { flex: 1; min-width: 160px; }
  #testpanel button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: #b0101c; color: #fff; cursor: pointer; }
  #testpanel button.secondary { background: #e4e4ee; color: #222; }
  #testpanel .info { margin-top: 8px; color: #555; display: flex; gap: 16px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="stage">
  <div class="card hidden" id="card">
    <div class="head off" id="head"></div>
    <div class="body" id="body"><div class="content out" id="content"></div></div>
  </div>
</div>

<script>
// ================== EINSTELLUNGEN ==================
const CONFIG = {
  channel: "flushedjulian", // Twitch-Kanal (oder per ?channel= in der URL)
  maxPoints: 100,           // Punkte bei sofortiger Antwort
  minPoints: 10,            // Punkte kurz vor Ablauf der Zeit
  questionSeconds: 90,      // Zeit pro Frage – danach wird übersprungen
  countdownSeconds: 15,     // "Nächste Frage in …" nach der Auflösung
  scoreboardAfterSeconds: 5, // so lange wird die Antwort gezeigt, dann wechselt es zum Scoreboard
  scoreboardSize: 5,        // wie viele Plätze im Scoreboard
  guessSeconds: 45,         // Schätzfragen: Zeit zum Tippen
  guessCountdownSeconds: 15, // Schätzfragen: "Nächste Frage in …" nach der Auflösung
  guessScoreboardAfterSeconds: 5, // Schätzfragen: so lange werden die Top 10 gezeigt, danach Scoreboard
  guessPoints: [100, 80, 65, 55, 45, 35, 25, 20, 15, 10], // Punkte für Platz 1–10
};

// Modi – Auswahl im Chat mit "!trivia #1", "!trivia #2", …
// Die Fragen stehen in den .txt-Dateien und werden bei jeder Modus-Wahl neu geladen.
const MODES = {
  1: { name: "Allgemeinwissen", file: "allgemeinwissen.txt", parse: p => ({ q: p[0], a: p.slice(1) }), minParts: 2 },
  2: { name: "Flaggen", file: "flaggen.txt", parse: p => ({ flag: p[0].toLowerCase(), a: p.slice(1) }), minParts: 2 },
  3: { name: "Wort erkennen", file: "woerter.txt", parse: p => ({ word: p[0], a: p }), minParts: 1 },
  4: { name: "Schätzfragen", file: "schaetzfragen.txt", parse: p => ({ q: p[0], value: parseGuess(p[1]), unit: p[2] || "", a: [], guess: true }), minParts: 2 },
};
// ===================================================

const params = new URLSearchParams(location.search);
const CHANNEL = (params.get("channel") || CONFIG.channel || "").trim().toLowerCase().replace(/^#/, "");
const TEST = params.has("test");
const STORAGE_KEY = "trivia-scores-" + (CHANNEL || "test");

const card = document.getElementById("card");
const headEl = document.getElementById("head");
const bodyEl = document.getElementById("body");
const contentEl = document.getElementById("content");

// ---------- Punkte speichern ----------
let scores = {};
try { scores = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { scores = {}; }
function saveScores() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scores)); } catch {}
}

// ---------- Fragen laden ----------
async function loadQuestions(m) {
  const res = await fetch(m.file + "?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(m.file + ": " + res.status);
  const text = await res.text();
  return text.split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line && !line.startsWith("#"))
    .map(line => line.split("|").map(part => part.trim()).filter(Boolean))
    .filter(parts => parts.length >= m.minParts)
    .map(m.parse)
    .filter(q => !q.guess || Number.isFinite(q.value));
}

// ---------- Antworten prüfen ----------
function normalizeChars(s) {
  return s.toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ").trim();
}

function normalize(s) {
  return normalizeChars(s).replace(/^(der|die|das|ein|eine) /, "");
}

function levenshtein(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return row[b.length];
}

// Zahl → deutsche Zahlwörter (alle üblichen Schreibweisen), z.B. 21 → einundzwanzig, 1989 → neunzehnhundertneunundachtzig
const ONES = ["null", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf",
  "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
const TENS = ["", "", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];

function under100(n) {
  if (n < 20) return ONES[n];
  const unit = n % 10, ten = TENS[Math.floor(n / 10)];
  return unit ? (unit === 1 ? "ein" : ONES[unit]) + "und" + ten : ten;
}

function under1000(n) { // liefert mehrere Varianten ("hundert" / "einhundert")
  const h = Math.floor(n / 100), rest = n % 100;
  if (!h) return [under100(n)];
  const heads = h === 1 ? ["hundert", "einhundert"] : [(h === 1 ? "ein" : ONES[h]) + "hundert"];
  return heads.map(head => rest ? head + under100(rest) : head);
}

function numberWords(n) {
  if (n < 1000) return under1000(n);
  const th = Math.floor(n / 1000), rest = n % 1000;
  const heads = th === 1 ? ["tausend", "eintausend"] : under1000(th).map(x => x.replace(/eins$/, "ein") + "tausend");
  const tails = rest ? under1000(rest) : [""];
  const words = heads.flatMap(head => tails.map(tail => head + tail));
  if (n >= 1100 && n < 2000) { // Jahreszahlen: neunzehnhundert…
    const r = n % 100;
    words.push(under100(Math.floor(n / 100)) + "hundert" + (r ? under100(r) : ""));
  }
  return words;
}

// blocked: alle Antworten der anderen Fragen im Modus. Wer genau so eine schreibt (z.B. "Irland"
// bei der Frage nach Island), bekommt keinen Treffer über die Tippfehler-Toleranz.
function isCorrect(message, answers, blocked = new Set()) {
  const msg = normalize(message);
  const compact = normalizeChars(message).replace(/ /g, ""); // "neun und achtzig" → "neunundachtzig"
  return answers.some(answer => {
    const a = normalize(answer);
    if (msg === a) return true;
    if (/^\d+$/.test(a)) {
      // Zahlen: Ziffern müssen exakt stimmen, ausgeschrieben sind kleine Tippfehler erlaubt
      if (blocked.has(msg)) return false;
      const n = Number(a);
      if (n > 9999) return false;
      return numberWords(n).some(word => {
        const w = normalize(word);
        return compact === w || levenshtein(compact, w) <= (w.length >= 9 ? 2 : w.length >= 5 ? 1 : 0);
      });
    }
    if (blocked.has(msg)) return false;
    const tolerance = a.length >= 9 ? 2 : a.length >= 5 ? 1 : 0;
    return levenshtein(msg, a) <= tolerance;
  });
}

// Alle Antworten eines Modus als Set (gecacht pro geladener Fragenliste)
const answerSets = new WeakMap();
function answersOf(questions) {
  if (!answerSets.has(questions)) answerSets.set(questions, new Set(questions.flatMap(q => q.a.map(normalize))));
  return answerSets.get(questions);
}

// Schätzung aus einer Chatnachricht lesen: "384400", "384.400", "ca. 400k", "1,5 Mio", "45 Jahre" …
function parseGuess(text) {
  const s = String(text).trim().toLowerCase().replace(/^(ca\.?|circa|etwa|ungefähr|ungefaehr|~)\s*/, "");
  const m = s.match(/^\d[\d.,' ]*/);
  if (!m) return null;
  // Zusatz direkt hinter der Zahl ("400k", "1,5 Mio"); Einheiten wie "300m" oder "400 km" werden ignoriert
  const sm = s.slice(m[0].length).trim().match(/^(k|tsd\.?|tausend|mio\.?|millionen|million|mrd\.?|milliarden|milliarde)(?![a-zäöüß])/);
  let num = m[0].replace(/[' ]/g, "").replace(/[.,]+$/, "");
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(num)) num = num.replace(/\./g, "").replace(",", "."); // 384.400 / 1.234,5
  else if (/^\d+,\d+$/.test(num)) num = num.replace(",", ".");                                  // 149,6
  else if (!/^\d+(\.\d+)?$/.test(num)) return null;
  let value = Number(num);
  const suffix = sm ? sm[1] : "";
  if (/^(k|tsd|tausend)/.test(suffix)) value *= 1e3;
  else if (/^(mio|million)/.test(suffix)) value *= 1e6;
  else if (/^(mrd|milliard)/.test(suffix)) value *= 1e9;
  return Number.isFinite(value) ? value : null;
}

// Wie die Einheit im Overlay erscheint: Hinweis unter der Frage + Anhang an Zahlen
const UNIT_NAMES = {
  "m": "Metern", "km": "Kilometern", "cm": "Zentimetern", "kg": "Kilogramm", "g": "Gramm", "t": "Tonnen",
  "liter": "Litern", "l": "Litern", "m/s": "Metern pro Sekunde", "km/h": "Kilometern pro Stunde", "°c": "Grad Celsius",
  "sekunden": "Sekunden", "minuten": "Minuten", "stunden": "Stunden", "tage": "Tagen", "jahre": "Jahren",
  "mio. km": "Millionen Kilometern",
};

function unitInfo(unit) {
  const u = (unit || "").trim();
  if (u.toLowerCase() === "jahr") return { label: "Angabe: Jahreszahl", suffix: "" };
  const name = UNIT_NAMES[u.toLowerCase()];
  if (name) return { label: "Angabe in " + name, suffix: " " + u };
  return { label: u ? "Angabe: Anzahl " + u : "Angabe: Zahl", suffix: u ? " " + u : "" };
}

function formatNumber(n) {
  return new Intl.NumberFormat("de-DE", { maximumFractionDigits: 2 }).format(n);
}

function pointsAt(seconds) {
  const { maxPoints, minPoints, questionSeconds } = CONFIG;
  const progress = Math.min(seconds / questionSeconds, 1);
  return Math.round(maxPoints - (maxPoints - minPoints) * progress);
}

// ---------- Spielablauf ----------
let phase = "idle"; // idle | menu | loading | question | reveal | scoreboard | stopped
let mode = null;
let order = [];
let current = null;
let startTime = 0;
let wordState = null;
let guesses = new Map(); // Schätzfragen: id → { name, color, value, time }
let loadToken = 0;

// Alle laufenden Timer merken, damit Befehle sie sauber abbrechen können
let timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function every(fn, ms) { const id = setInterval(fn, ms); timers.push(id); return id; }
function clearTimers() {
  timers.forEach(id => { clearTimeout(id); clearInterval(id); });
  timers = [];
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Kopfzeile weich ein-/ausklappen (beim Ausklappen bleibt der alte Inhalt stehen, bis sie zu ist)
function setHead(html) {
  if (html) headEl.innerHTML = html;
  headEl.classList.toggle("off", !html);
}

// Inhalt tauschen: alter Inhalt fährt nach unten raus, neuer fährt von unten rein,
// die Karte passt ihre Höhe dabei weich an
const EXIT_MS = 220;
const ENTER_MS = 400;
let bodyToken = 0;

function setBody(html) {
  if (phase !== "menu") card.classList.remove("full");
  const token = ++bodyToken;
  const firstShow = card.classList.contains("hidden");
  card.classList.remove("hidden");
  const startHeight = bodyEl.offsetHeight;
  bodyEl.style.height = startHeight + "px";
  contentEl.classList.add("out");

  setTimeout(() => {
    if (token !== bodyToken) return; // inzwischen schon wieder neuer Inhalt
    contentEl.innerHTML = html;
    bodyEl.style.height = "auto";
    const targetHeight = bodyEl.offsetHeight;
    bodyEl.style.height = startHeight + "px";
    void bodyEl.offsetHeight; // Layout erzwingen, damit die Höhe animiert
    bodyEl.style.height = targetHeight + "px";
    contentEl.classList.remove("out");
    setTimeout(() => { if (token === bodyToken) bodyEl.style.height = "auto"; }, ENTER_MS);
  }, firstShow ? 0 : EXIT_MS);
}

// !trivia start → Modus-Menü (oder Pause-Hinweis, wenn pausiert)
function startGame() {
  if (phase === "paused") return showPausedScreen();
  if (phase !== "idle" && phase !== "stopped") return; // läuft schon
  showMenu();
}

// !trivia exit → zurück zum Menü (beendet auch eine Pause)
function exitToMenu() {
  if (phase === "idle" || phase === "stopped" || phase === "menu") return;
  paused = null;
  showMenu();
}

// !trivia pause → Overlay zuklappen, Spielstand und Punkte bleiben erhalten
let paused = null;
const ACTIVE_PHASES = ["menu", "loading", "question", "reveal", "scoreboard"];

function pauseGame() {
  if (phase === "paused") return card.classList.add("hidden"); // Pause-Hinweis wieder zuklappen
  if (!ACTIVE_PHASES.includes(phase)) return;
  paused = {
    phase,
    elapsed: phase === "question" ? (performance.now() - startTime) / 1000 : 0,
  };
  clearTimers();
  bodyToken++; // laufenden Inhaltswechsel abbrechen
  loadToken++; // laufendes Laden einer Fragenliste abbrechen
  phase = "paused";
  card.classList.add("hidden");
  updateTestInfo();
}

function showPausedScreen() {
  setHead("");
  setBody(`
    <div class="title">⏸️ Pausiert</div>
    <ul class="rows modes"><li><span class="cmd">!trivia resume</span><span>zum Weiterspielen</span></li></ul>
  `);
}

// !trivia resume → da weitermachen, wo pausiert wurde
function resumeGame() {
  if (phase !== "paused") return;
  const p = paused;
  paused = null;
  if (p.phase === "question") showQuestion(p.elapsed);   // gleiche Frage, Zeit läuft weiter
  else if (p.phase === "reveal" || p.phase === "scoreboard") nextQuestion();
  else showMenu();
}

function showMenu() {
  clearTimers();
  phase = "menu";
  card.classList.add("full");
  current = null;
  const items = Object.entries(MODES).map(([nr, m]) => `
    <li><span class="cmd">!trivia #${nr}</span><span>${escapeHtml(m.name)}</span></li>`).join("");
  setHead("");
  setBody(`
    <div class="title">🎮 Trivia – Modus wählen</div>
    <ul class="rows modes">${items}</ul>
    <div class="commands">
      <b>!trivia skip</b> Frage überspringen · <b>!trivia exit</b> zurück zum Menü<br>
      <b>!trivia pause</b> / <b>resume</b> Pause · <b>!trivia stop</b> beenden (Punkte weg)
    </div>
  `);
  updateTestInfo();
}

// !trivia stop → alles beenden und Punkte zurücksetzen
function stopGame() {
  clearTimers();
  bodyToken++; // laufenden Inhaltswechsel abbrechen
  loadToken++; // laufendes Laden einer Fragenliste abbrechen
  phase = "stopped";
  paused = null;
  current = null;
  order = [];
  scores = {};
  saveScores();
  card.classList.add("hidden");
  updateTestInfo();
}

// !trivia #1, #2, … → Modus wählen (auch mitten im Spiel zum Wechseln)
async function selectMode(nr) {
  const m = MODES[nr];
  if (!m || !ACTIVE_PHASES.includes(phase)) return;
  clearTimers();
  phase = "loading";
  const token = ++loadToken;
  try {
    m.questions = await loadQuestions(m);
  } catch {
    m.questions = m.questions || [];
  }
  if (token !== loadToken || phase !== "loading") return; // inzwischen anderer Befehl
  if (m.questions.length === 0) {
    phase = "menu";
    setHead("");
    setBody(`<div class="title">Keine Fragen gefunden</div><div class="hint">${escapeHtml(m.file)} ist leer oder konnte nicht geladen werden.</div>`);
    return;
  }
  mode = m;
  order = [];
  nextQuestion();
}

// Während einer Frage: Antwort auflösen. Nach der Auflösung: direkt zur nächsten Frage.
function skipQuestion() {
  if (phase === "question") current.guess ? revealGuess() : reveal(null, "Übersprungen – die Antwort war");
  else if (phase === "reveal" || phase === "scoreboard") nextQuestion();
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds - m * 60;
  return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0");
}

function flagUrl(code) {
  return "https://cdn.jsdelivr.net/npm/flag-icons@7/flags/4x3/" + encodeURIComponent(code) + ".svg";
}

function questionHtml(item) {
  if (item.flag) {
    return `
      <div class="question">Welches Land hat diese Flagge?</div>
      <img class="flag" src="${flagUrl(item.flag)}" alt="">`;
  }
  if (item.word) {
    // Felder bei langen Wörtern schmaler machen, damit alles in eine Zeile passt (Platz neben "x Buchstaben")
    const slotSize = Math.max(28, Math.min(52, Math.floor(620 / wordState.letters.length) - 10));
    const slots = wordState.letters.map((ch, i) => ch === " "
      ? `<span class="slot space"></span>`
      : `<span class="slot" id="slot-${i}"></span>`).join("");
    return `
      <div class="question">Welches Wort ist das?</div>
      <div class="word-row">
        <div class="slots" style="--slot:${slotSize}px">${slots}</div>
        <span class="count">${wordState.revealOrder.length} Buchstaben</span>
      </div>`;
  }
  return `<div class="question">${escapeHtml(item.q)}</div>`;
}

function nextQuestion() {
  clearTimers();
  if (order.length === 0) {
    order = shuffle(mode.questions);
    // im Hintergrund neu laden, damit neu eingetragene Fragen in der nächsten Runde dabei sind
    const m = mode;
    loadQuestions(m).then(q => { if (q.length) m.questions = q; }).catch(() => {});
  }
  current = order.shift();
  guesses = new Map();

  wordState = null;
  if (current.word) {
    const letters = [...current.word.toUpperCase()];
    const indices = letters.map((ch, i) => i).filter(i => letters[i] !== " ");
    wordState = { letters, revealOrder: shuffle(indices), shown: 0 };
  }
  showQuestion(0);
}

// Aktuelle Frage anzeigen; elapsed > 0 beim Fortsetzen nach einer Pause
function showQuestion(elapsed) {
  clearTimers();
  phase = "question";
  startTime = performance.now() - elapsed * 1000;
  if (wordState) wordState.shown = 0; // schon aufgedeckte Buchstaben setzt tick() gleich wieder ein

  setHead("");
  if (current.guess) {
    setBody(`
      <div class="top"><span class="timer" id="timer">${formatCountdown(CONFIG.guessSeconds - elapsed)}</span></div>
      <div class="question">${escapeHtml(current.q)}</div>
      <div class="unit-badge">${escapeHtml(unitInfo(current.unit).label)}</div>
      <div class="points-row">
        <span class="points" id="guess-count">${tipCount()}</span>
        <div class="bar"><div id="bar" style="width:${Math.max(0, 100 - elapsed / CONFIG.guessSeconds * 100)}%"></div></div>
      </div>
      <div class="hint">Schätz als Zahl im Chat!</div>
    `);
    updateTestInfo();
    every(tick, 100);
    return;
  }
  setBody(`
    <div class="top"><span class="timer" id="timer">00:00.0</span></div>
    ${questionHtml(current)}
    <div class="points-row">
      <span class="points" id="points">+${CONFIG.maxPoints} Punkte</span>
      <div class="bar"><div id="bar" style="width:100%"></div></div>
    </div>
    <div class="hint">Schreib die Antwort in den Chat!</div>
  `);
  updateTestInfo();
  every(tick, 100);
}

// Wort erkennen: Buchstaben gleichmäßig über die Fragezeit aufdecken, der letzte bleibt verdeckt
function revealLetters(elapsed) {
  const n = wordState.revealOrder.length;
  const target = Math.min(n - 1, Math.floor(elapsed / (CONFIG.questionSeconds / n)));
  while (wordState.shown < target) {
    const i = wordState.revealOrder[wordState.shown];
    const slot = document.getElementById("slot-" + i);
    if (!slot) return; // Inhalt noch nicht eingeblendet
    slot.textContent = wordState.letters[i];
    slot.classList.add("open");
    wordState.shown++;
  }
}

function tipCount() {
  return guesses.size + (guesses.size === 1 ? " Tipp" : " Tipps");
}

function formatCountdown(seconds) {
  const s = Math.max(0, Math.ceil(seconds));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function tick() {
  if (phase !== "question") return;
  const elapsed = (performance.now() - startTime) / 1000;
  if (current.guess) {
    const timerEl = document.getElementById("timer");
    const barEl = document.getElementById("bar");
    if (timerEl) timerEl.textContent = formatCountdown(CONFIG.guessSeconds - elapsed);
    if (barEl) barEl.style.width = Math.max(0, 100 - (elapsed / CONFIG.guessSeconds) * 100) + "%";
    if (elapsed >= CONFIG.guessSeconds) revealGuess();
    return;
  }
  const timerEl = document.getElementById("timer");
  const pointsEl = document.getElementById("points");
  const barEl = document.getElementById("bar");
  if (timerEl) timerEl.textContent = formatTime(elapsed);
  if (pointsEl) pointsEl.textContent = "+" + pointsAt(elapsed) + " Punkte";
  if (barEl) barEl.style.width = Math.max(0, 100 - (elapsed / CONFIG.questionSeconds) * 100) + "%";
  if (wordState) revealLetters(elapsed);
  if (elapsed >= CONFIG.questionSeconds) reveal(null); // Zeit um → überspringen
}

// Auflösung + Countdown oben; nach scoreboardAfterSeconds wechselt der Inhalt zum Scoreboard
function reveal(winner, noWinnerLabel = "Zeit abgelaufen – die Antwort war") {
  clearTimers();
  phase = "reveal";
  const answer = current.flag
    ? `<img class="flag-small" src="${flagUrl(current.flag)}" alt="">${escapeHtml(current.a[0])}`
    : escapeHtml(current.a[0]);
  setBody(winner
    ? `<div class="label">Richtige Antwort</div>
       <div class="answer">${answer}</div>
       <div class="winner"><b style="color:${winner.color}">${escapeHtml(winner.name)}</b> nach ${winner.seconds.toFixed(1)} s
         · <span class="pts">+${winner.points} Punkte</span></div>`
    : `<div class="label">${noWinnerLabel}</div>
       <div class="answer">${answer}</div>`);
  startNextCountdown(CONFIG.countdownSeconds, CONFIG.scoreboardAfterSeconds, () => showScoreboard(winner && winner.id));
}

// "Nächste Frage in …" oben; nach switchAfter Sekunden wechselt der Inhalt (zum Scoreboard)
function startNextCountdown(total, switchAfter, onSwitch) {
  let left = total;
  setHead(`<span class="label">Nächste Frage in</span><span class="big" id="cd">${left}</span>`);
  every(() => {
    left--;
    const cd = document.getElementById("cd");
    if (cd) cd.textContent = left;
    if (left === total - switchAfter) onSwitch();
    if (left <= 0) nextQuestion();
  }, 1000);
}

// Schätzfragen auflösen: die 10 Nächsten (bei gleichem Abstand zählt der frühere Tipp) bekommen Punkte
function revealGuess() {
  clearTimers();
  phase = "reveal";
  const ranked = [...guesses.entries()]
    .map(([id, g]) => ({ id, ...g, diff: Math.abs(g.value - current.value) }))
    .sort((a, b) => a.diff - b.diff || a.time - b.time)
    .slice(0, CONFIG.guessPoints.length);

  ranked.forEach((r, i) => {
    r.points = CONFIG.guessPoints[i];
    if (!scores[r.id]) scores[r.id] = { name: r.name, points: 0 };
    scores[r.id].name = r.name;
    scores[r.id].color = r.color || "";
    scores[r.id].points += r.points;
  });
  if (ranked.length) saveScores();

  const unit = escapeHtml(unitInfo(current.unit).suffix);
  const list = ranked.length
    ? `<div class="guess-meta">Die ${ranked.length} Nächsten von ${tipCount()}</div>
       <ol class="rows board guesses">${ranked.map((r, i) => `
        <li>
          <span class="rank">#${i + 1}</span>
          <span class="name" style="color:${nameColor(r.id, r.color)}">${escapeHtml(r.name)}</span>
          <span class="tip">${formatNumber(r.value)}${unit}</span>
          <span class="score">+${r.points}</span>
        </li>`).join("")}</ol>`
    : `<div class="empty">Niemand hat geschätzt.</div>`;

  setBody(`
    <div class="label">Richtige Antwort</div>
    <div class="answer">${formatNumber(current.value)}${unit}</div>
    ${list}`);
  startNextCountdown(CONFIG.guessCountdownSeconds, CONFIG.guessScoreboardAfterSeconds, () => showScoreboard(ranked[0] && ranked[0].id));
}

function showScoreboard(highlightId) {
  phase = "scoreboard";
  const top = Object.entries(scores)
    .sort((a, b) => b[1].points - a[1].points)
    .slice(0, CONFIG.scoreboardSize);

  const rows = top.length
    ? `<ol class="rows board">${top.map(([id, s], i) => `
        <li class="${id === highlightId ? "me" : ""}">
          <span class="rank">#${i + 1}</span>
          <span class="name" style="color:${nameColor(id, s.color)}">${escapeHtml(s.name)}</span>
          <span class="score">${s.points}</span>
        </li>`).join("")}</ol>`
    : `<div class="empty">Noch keine Punkte vergeben.</div>`;

  setBody(`<div class="title">🏆 Scoreboard</div>${rows}`);
}

// ---------- Namensfarben ----------
// Twitch-Standardfarben für User, die keine eigene Farbe gewählt haben
const DEFAULT_COLORS = ["#FF0000", "#0000FF", "#008000", "#B22222", "#FF7F50", "#9ACD32", "#FF4500",
  "#2E8B57", "#DAA520", "#D2691E", "#5F9EA0", "#1E90FF", "#FF69B4", "#8A2BE2", "#00FF7F"];

function luminance([r, g, b]) {
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}

// Chat-Farbe des Users; zu dunkle Farben werden aufgehellt, damit sie auf Schwarz lesbar sind
function nameColor(id, color) {
  if (!/^#[0-9a-f]{6}$/i.test(color || "")) {
    const hash = [...id].reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
    color = DEFAULT_COLORS[hash % DEFAULT_COLORS.length];
  }
  let rgb = [1, 3, 5].map(i => parseInt(color.slice(i, i + 2), 16));
  while (luminance(rgb) < 0.2) rgb = rgb.map(c => Math.round(c + (255 - c) * 0.15));
  return "rgb(" + rgb.join(",") + ")";
}

// ---------- Freigegebene User (config.json, wird jede Minute neu geladen) ----------
let allowedUsers = [];

async function loadConfig() {
  try {
    const res = await fetch("config.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const config = await res.json();
    allowedUsers = (config.allowedUsers || []).map(u => String(u).toLowerCase().replace(/^@/, ""));
  } catch {}
}

// ---------- Chat-Nachrichten verarbeiten ----------
function onChatMessage({ id, name, text, canControl, color }) {
  const command = text.trim().toLowerCase().replace(/\s+/g, " ");
  if (command.startsWith("!trivia ")) {
    if (!canControl && !allowedUsers.includes(id)) return;
    if (command === "!trivia start") startGame();
    if (command === "!trivia stop") stopGame();
    if (command === "!trivia skip") skipQuestion();
    if (command === "!trivia exit") exitToMenu();
    if (command === "!trivia pause") pauseGame();
    if (command === "!trivia resume") resumeGame();
    const modeMatch = command.match(/^!trivia #?(\d+)$/); // "!trivia #1" (oder "!trivia 1")
    if (modeMatch) selectMode(modeMatch[1]);
    return;
  }

  if (phase !== "question") return;
  if (current.guess) {
    if (guesses.has(id)) return; // nur der erste Tipp zählt
    const value = parseGuess(text);
    if (value === null) return;
    guesses.set(id, { name, color, value, time: performance.now() });
    const countEl = document.getElementById("guess-count");
    if (countEl) countEl.textContent = tipCount();
    return;
  }
  if (!isCorrect(text, current.a, answersOf(mode.questions))) return;

  const seconds = (performance.now() - startTime) / 1000;
  const points = pointsAt(seconds);
  if (!scores[id]) scores[id] = { name, points: 0 };
  scores[id].name = name;
  scores[id].color = color || "";
  scores[id].points += points;
  saveScores();
  reveal({ id, name, seconds, points, color: nameColor(id, color) });
}

// ---------- Twitch-Chat (anonym, nur lesen) ----------
let connectionStatus = "nicht verbunden";

function connectTwitch() {
  const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags");
    ws.send("PASS SCHMOOPIIE");
    ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 80000));
    ws.send("JOIN #" + CHANNEL);
  };

  ws.onmessage = event => {
    for (const line of event.data.split("\r\n")) {
      if (!line) continue;
      if (line.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); continue; }
      if (line.includes(" JOIN #" + CHANNEL)) setStatus("verbunden mit #" + CHANNEL);

      const match = line.match(/^(?:@(\S+) )?:(\w+)!\S+ PRIVMSG #\S+ :(.*)$/);
      if (!match) continue;
      const [, rawTags, login, text] = match;
      const tags = Object.fromEntries((rawTags || "").split(";").map(t => t.split("=")));
      const badges = tags["badges"] || "";
      // Streamer, Mods und VIPs dürfen das Quiz steuern
      const canControl = tags["mod"] === "1" || tags["vip"] === "1" || /(^|,)(broadcaster|moderator|vip)\//.test(badges);
      onChatMessage({ id: login, name: tags["display-name"] || login, text, canControl, color: tags["color"] });
    }
  };

  ws.onclose = () => {
    setStatus("getrennt – neuer Versuch in 3 s");
    setTimeout(connectTwitch, 3000);
  };
}

function setStatus(text) {
  connectionStatus = text;
  updateTestInfo();
}

// ---------- Testmodus ----------
function setupTestPanel() {
  document.body.classList.add("test");
  const panel = document.createElement("div");
  panel.id = "testpanel";
  panel.innerHTML = `
    <form id="fakechat">
      <input name="user" value="TestUser" placeholder="Name">
      <input name="msg" placeholder="Chatnachricht simulieren…" autocomplete="off">
      <button type="submit">Senden</button>
      <button type="button" class="secondary" id="reset">Punkte zurücksetzen</button>
    </form>
    <div class="info"><span id="solution"></span><span id="status"></span></div>
  `;
  document.body.appendChild(panel);

  panel.querySelector("#fakechat").addEventListener("submit", e => {
    e.preventDefault();
    const form = e.target;
    const name = form.user.value.trim() || "TestUser";
    // im Test zählt man als Mod
    onChatMessage({ id: name.toLowerCase(), name, text: form.msg.value, canControl: true });
    form.msg.value = "";
  });
  panel.querySelector("#reset").addEventListener("click", () => {
    scores = {};
    saveScores();
  });
}

function updateTestInfo() {
  if (!TEST) return;
  const sol = document.getElementById("solution");
  const status = document.getElementById("status");
  if (sol) sol.textContent = !current ? "" : "Lösung: " + (current.guess ? formatNumber(current.value) + unitInfo(current.unit).suffix : current.a.join(" / "));
  if (status) status.textContent = "Twitch: " + (CHANNEL ? connectionStatus : "kein ?channel= angegeben");
}

// ---------- Start ----------
if (TEST) setupTestPanel();
if (CHANNEL) connectTwitch();
loadConfig();
setInterval(loadConfig, 60 * 1000);

if (!CHANNEL && !TEST) {
  setBody(`
    <div class="title">Trivia Overlay</div>
    <div class="hint">Bitte <b>?channel=kanalname</b> an die URL hängen (oder <b>?test</b> zum Ausprobieren).</div>
  `);
} else if (TEST) {
  startGame(); // im Test direkt das Menü zeigen; im Stream bleibt das Overlay bis "!trivia start" unsichtbar
}
</script>
